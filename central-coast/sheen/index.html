<div id="modal" class="modal fade show" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-window">
      <!-- titlebar -->
      <div class="titlebar handle">
        <div class="buttons">
          <div id="close-btn" class="circleButton">
            <div class="closebutton"><div class="innerC"></div></div>
          </div>
          <div class="minimize circleButton" id="minimize-btn">
            <div class="minimizebutton"><div class="innerC"></div></div>
          </div>
          <div class="zoom circleButton">
            <div class="zoombutton"><div class="innerC"></div></div>
          </div>
        </div>
        <div class="titleTxtContainer"></div>
      </div>

      <!-- content -->
      <div class="content p-3">
        <div class="label-content p-3 mb-2">
          <div class="wall-title mb-3">Sheen</div>
          <div>Jenna deBoisblanc</div>
          <div>Custom Software</div>
          <div>Dimensions variable</div>
          <div>2026</div>
        </div>
        <button id="close-btn2" class="btn btn-dark">ok</button>
      </div>
      </div>
    </div>
  </div>
</div>

<script>
  let startAnimation = false; // Global variable to signal p5.js

  document.addEventListener("DOMContentLoaded", function () {
    const modalElement = document.getElementById("modal");
    const closeBtn = document.getElementById("close-btn");
    const closeBtn2 = document.getElementById("close-btn2");
    const minimizeBtn = document.getElementById("minimize-btn");
    const zoomBtn = modalElement.querySelector(".zoom");
    const contentEl = modalElement.querySelector(".content");
    const windowEl = modalElement.querySelector(".modal-window");

    // Show modal on page load
    modalElement.classList.add("show");
    modalElement.style.display = "block";

    // Close the modal when the close button is clicked
    closeBtn.addEventListener("click", function () {
      modalElement.classList.remove("show");
      modalElement.style.display = "none";
      startAnimation = true;
    });

     // Close the modal when the close button is clicked
     closeBtn2.addEventListener("click", function () {
      modalElement.classList.remove("show");
      modalElement.style.display = "none";
      startAnimation = true;
    });

    // Toggle the content area, collapsing the window down to just its
    // titlebar — click again to restore it, since there's no taskbar here
    // to un-minimize from. .modal-window's own min-height/min-width (see
    // <style> below) would otherwise leave a big empty white box once the
    // content is hidden, so those get overridden too via .minimized.
    minimizeBtn.addEventListener("click", function () {
      const minimized = contentEl.style.display !== "none";
      contentEl.style.display = minimized ? "none" : "flex";
      windowEl.classList.toggle("minimized", minimized);
    });

    // Snap back to its default centered position — undoes any dragging by
    // zeroing out the left/top offset the drag handler below applies on
    // top of the centering from margin:auto.
    zoomBtn.addEventListener("click", function () {
      windowEl.style.left = "0px";
      windowEl.style.top = "0px";
    });

    // Drag by the titlebar. .modal-window is centered by its flex parent
    // (see .modal-dialog-centered/margin:auto in <style> below) — giving it
    // position:relative (see <style>) lets these left/top offsets layer on
    // top of that centered position instead of fighting the layout.
    const titlebar = modalElement.querySelector(".titlebar");
    let dragging = false;
    let startX, startY, startLeft, startTop;
    titlebar.addEventListener("mousedown", function (e) {
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startLeft = parseFloat(windowEl.style.left) || 0;
      startTop = parseFloat(windowEl.style.top) || 0;
      e.preventDefault();
    });
    window.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      windowEl.style.left = startLeft + (e.clientX - startX) + "px";
      windowEl.style.top = startTop + (e.clientY - startY) + "px";
    });
    window.addEventListener("mouseup", function () {
      dragging = false;
    });
  });


</script>
<style>
  /**
 * 98.css

  /* Borders */
  /* Window borders flip button-face and button-highlight */
  /* Field borders (checkbox, input, etc) flip window-frame and button-shadow */
  #modal {
    color: #000;
    font-family: consoleFont, HelveticaNeue, "Helvetica Neue", "Lucida Grande",
      Arial, sans-serif;
    position: absolute;
    /* margin-bottom: -33px; */
    font-size: 12px;
    pointer-events: none;
  }

  #modal span {
    line-height: 8px;
    vertical-align: 50%;
  }
  #modal .modal-window {
    border-radius: 8px;
    box-shadow: 0px 0px 20px #000000; /* #6c6c6c; */
    padding-bottom: 2px;
    overflow: hidden;
    min-height: 200px;
    min-width: 320px;
    background-color: #fff;
    margin: auto;
    /* Lets the drag handler's left/top offsets (see <script> above) apply
       on top of the centered position from margin:auto, instead of doing
       nothing (left/top are no-ops on a statically-positioned element). */
    position: relative;
  }

  /* Applied when minimize-btn hides .content — without this the window's
     own min-height/padding-bottom above leave a big empty white box behind
     the (now display:none) content instead of actually collapsing. */
  #modal .modal-window.minimized {
    min-height: 0;
    padding-bottom: 0;
  }

  #modal .titlebar {
    position: relative;
    height: 26px;
    pointer-events: all;
    font-family: consoleFont, sans-serif;
    font-size: 0.8em;
    line-height: 20px;
    text-align: center;
    width: 100%;
    color: white;
    background: black;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -o-user-select: none;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    cursor: grab;
  }
  #modal .titlebar:active {
    cursor: grabbing;
  }
  #modal .titleTxtContainer {
    position: relative;
    height: 26px;
    white-space: nowrap;
    flex-grow: 1;
    text-align: center;
    display: flex;
    justify-content: center;
    flex-direction: column; /* <--- I added this */
    align-items: center; /* <--- Change here */
    width: 100%;
  }
  #modal .buttons {
    padding-left: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    float: left;
    white-space: nowrap;
    line-height: 0px;
    /* made them match titlebar to show up on Stair */
    font-family: HelveticaNeue, "Helvetica Neue", "Lucida Grande", Arial,
      sans-serif;
    height: 26px;
    width: 70px;
    flex-shrink: 0;
  }

  #modal .circleButton {
    /* border: .15em solid black; */
    border-radius: 50%;
    background: white;
    color: white;
    font-size: 8pt;
    line-height: 10px;
    margin-right: 8px;
    width: 12px;
    height: 12px;
    display: inline-block;
    cursor: pointer;
    /* doing this to position inner circle absolute relative to inner */
    position: relative;
  }
  #modal .circleButton:hover {
    background: white;
  }
  #modal .circleButton .innerC {
    position: absolute;
    background: black;
    border-radius: 50%;
    height: 8px;
    width: 8px;
    transition: background 0.1s ease, box-shadow 0.1s ease;
    /*
  Put top edge and left edge in the center
  */
    top: 50%;
    left: 50%;
    margin: -4px 0px 0px -4px;
    /*
  Offset the position correctly with
  minus half of the width and minus half of the height
  */
  }
  /* Hovering anywhere on the (bigger) circleButton turns the dot white, not
     just the tiny 8px dot itself — otherwise there was no visible hover
     feedback across most of the button's actual clickable area. */
  #modal .circleButton:hover .innerC {
    background: white;
  }
  #modal .content {
    font-size: 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: all;
  }
  #modal .label-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #modal .wall-title {
    font-size: 16px;
    font-family: consoleFontBold;
  }

  #modal .btn {
    font-size: 12px;
    padding: 5px 20px;
  }
</style>

    <div class="oil-texture"></div>
    <!-- Sits behind the gif-tile boxes (.scene-box-bg) — the main
         #p5-sketch canvas is the topmost layer, so draw-order within it
         can't do that. Currently a looping crude-oil video background
         (oilSwirl.js/OilBrush.js, the p5 ambient swirl, is disabled — see
         index.js — and can be swapped back in for this video). -->
    <div id="oil-swirl">
      <!-- autoplay is a best-effort fallback; index.js explicitly calls
           .play() when the modal's close/ok button is clicked, since that's
           a real user gesture and reliably bypasses autoplay restrictions
           browsers otherwise silently apply. -->
      <video
        id="crude-oil-video"
        autoplay
        loop
        muted
        playsinline
        src="/netscapes/assets/central-coast/sheen/crude_oil_video.mov"
      ></video>
    </div>
    <!-- Ambient bead noise field (BeadField.js) — its own low-z-index p5
         canvas so it sits behind #threejs-container / .scene-box-bg but
         above the crude-oil video (same z-index as .oil-texture/#oil-swirl;
         placed after both in the DOM so ties break in its favor). Beads
         used to be drawn on the topmost #p5-sketch canvas (DecoFrame.js),
         which put them in front of the whole scene; moving them to a
         separate canvas is the only way to get part of a p5 drawing behind
         another CSS-stacked layer, since z-index applies to the whole
         canvas element, not individual draws within it. -->
    <div id="bead-field"></div>
    <div id="threejs-container"></div>
    <div id="p5-sketch"></div>
    <!-- A second, transparent three.js canvas for the pelican only, stacked
         ABOVE the p5 layer (see style.css) — so the part of the pelican
         that pokes out past the top boom border (see sceneGrid.js's
         PELICAN_POKE) renders in front of that border instead of being
         painted over by it. The waves scene stays on the regular
         #threejs-container, below the p5 layer, since it never pokes out. -->
    <div id="pelican-layer"></div>

    <!-- Single "orange container" gif-tile background box, holding the
         pelican + waves 3D scenes (see sceneGrid.js for the layout math).
         Positioned via inline style set by index.js (updateSceneBoxEls),
         from the same getSceneGrid() both the 3D viewports (index.js) and
         the p5-drawn frame (DecoFrame.js) read — one source of truth. -->
    <div class="deco-frame">
      <div class="scene-box-bg" data-box="outer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
